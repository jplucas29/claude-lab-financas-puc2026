name: Entrega do case
description: Envie os links da entrega do seu time (até 16h00 de 06/11).
title: "[Entrega] Nome do time — Case X"
body:
  - type: markdown
    attributes:
      value: |
        Preencham **uma única vez por time**, até as **16h00**. O horário do envio fica registrado.
        Os três links precisam ser **públicos**: abram cada um numa aba anônima antes de enviar.
  - type: input
    id: time
    attributes:
      label: Nome do time
    validations:
      required: true
  - type: dropdown
    id: case
    attributes:
      label: Case
      options:
        - Case 1 — Termômetro do Focus
        - Case 2 — Tradutor do Copom
        - Case 3 — Comparativo de resultados
    validations:
      required: true
  - type: textarea
    id: integrantes
    attributes:
      label: Integrantes
      description: Um por linha, com nome, curso e período.
    validations:
      required: true
  - type: input
    id: github
    attributes:
      label: Link do GitHub público do time
      placeholder: https://github.com/...
    validations:
      required: true
  - type: input
    id: artefato
    attributes:
      label: Link do artefato público
    validations:
      required: true
  - type: input
    id: video
    attributes:
      label: Link do vídeo (até 2 minutos)
    validations:
      required: true
  - type: checkboxes
    id: conferencia
    attributes:
      label: Antes de enviar
      options:
        - label: Abri os três links numa aba anônima e todos estão públicos.
          required: true
        - label: O README do GitHub do time segue o modelo e tem os links do vídeo e do artefato.
          required: true
        - label: Nenhuma senha, chave ou arquivo .env foi para o GitHub.
          required: true
  - type: textarea
    id: observacoes
    attributes:
      label: Observações (opcional)
